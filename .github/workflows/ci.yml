name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip

  unit-tests:
    runs-on: ubuntu-latest
    # Postgres backs the db/ integration tests. Without DATABASE_URL those
    # specs self-skip, so the whole db/ layer (schema DDL, the insert
    # transaction, and the stats SQL) is otherwise only ever exercised in
    # production. See apps/server/src/db/__tests__/game-results.integration.test.ts
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spades
          POSTGRES_PASSWORD: spades
          POSTGRES_DB: spades_test
        ports:
          - 5432:5432
        # The container reports ready before the server accepts connections;
        # without this the first test can race the startup and fail ECONNREFUSED.
        options: >-
          --health-cmd "pg_isready -U spades -d spades_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          # Enables the db/ integration specs. NODE_ENV is left unset (i.e. not
          # 'production'), so db/client.ts takes its ssl:false branch — the
          # service container speaks plaintext.
          DATABASE_URL: postgres://spades:spades@localhost:5432/spades_test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @spades/e2e exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
